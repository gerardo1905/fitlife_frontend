# /etc/nginx/sites-available/fitlife-frontend  (EC2 FRONTEND)
# Sirve la aplicación React compilada (npm run build -> carpeta dist/).
#
# Cabeceras de seguridad en un archivo aparte: en Nginx, si un bloque
# "location" usa add_header, deja de heredar las del bloque "server".
# Por eso se incluyen en cada location (hallazgo de OWASP ZAP).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/fitlife;
    index index.html;
    server_tokens off;

    # React Router: cualquier ruta (/socios/5, /clases...) devuelve index.html
    location / {
        include /etc/nginx/snippets/fitlife-seguridad.conf;
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre se pueden cachear por mucho tiempo
    location /assets/ {
        include /etc/nginx/snippets/fitlife-seguridad.conf;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }
}
