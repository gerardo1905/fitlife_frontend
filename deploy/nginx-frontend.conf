# /etc/nginx/sites-available/fitlife-frontend  (EC2 FRONTEND)
# Sirve la aplicación React compilada (npm run build -> carpeta dist/).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/fitlife;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # React Router: cualquier ruta (/socios/5, /clases...) devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre se pueden cachear por mucho tiempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
